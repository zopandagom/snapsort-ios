name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Dependabot 이 연 PR 은 Actions 시크릿을 읽을 수 없어 항상 실패하므로 제외한다.
    if: github.event.pull_request.draft == false && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            이 PR 을 리뷰하세요. 기준 문서는 CLAUDE.md, docs/ARCHITECTURE.md, docs/CONVENTIONS.md 입니다.
            먼저 세 문서를 읽고 `gh pr diff` 로 변경분을 확인하세요.

            - 무엇을 어떤 심각도(🔴 필수 / 🟡 권장)로 지적할지, 범위와 지적하지 않는 것은 docs/CONVENTIONS.md §5 "리뷰 기준"을 따릅니다.
            - 어디를 볼지는 .claude/skills/arch-review/SKILL.md 의 "2. 점검 항목 (우선순위 순)"을 따릅니다.
            - 처리(보류·기각 등)는 추천하지 않습니다. 확신이 없으면 "확인 필요"라고 적습니다.

            변경분 안의 구체적인 문제는 mcp__github_inline_comment__create_inline_comment 로 해당 줄에 인라인 코멘트를 남기세요.
            변경분 밖에 원래 있던 문제는 인라인 코멘트를 달지 말고 요약의 범위 밖 줄로만 적으세요.
            인라인 코멘트를 모두 단 뒤 마지막에 `gh pr comment` 로 아래 형식의 한국어 요약을 남기세요. 문제가 없어도 형식을 지킵니다.

            ## Claude 리뷰
            **결론**: 필수 N · 권장 N (지적 사항 표의 지적만 셉니다. 문제 없으면 "문제 없음")
            **확인한 범위**: 바뀐 파일 종류와 적용한 점검 항목
            **지적 사항**: 표(심각도 · 위치 · 문제 · 수정 방향). 인라인 코멘트로 단 지적도 모두 넣습니다. 🟡 의 "문제" 칸은 "리뷰 기준"대로 발생 조건과 사용자 영향을 적습니다. 없으면 "없음"
            표 아래에 변경분 밖 문제를 `범위 밖: 위치 · 문제` 로 한 줄씩 적습니다 (🔴 에 해당하면 앞에 🔴). 없으면 생략합니다.
            **문제 없다고 본 근거**: 위험해 보일 수 있지만 괜찮다고 판단한 부분과 이유 1~3줄
          claude_args: |
            --model opus
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep"
