name: CI

on:
  pull_request:
    paths-ignore: ["**.md", "docs/**", ".claude/**"]
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", ".claude/**"]
  # PR 없이 브랜치에서 CI 를 돌릴 때: gh workflow run CI --ref <브랜치>
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 비공개 레포의 macOS 러너는 분당 10배 과금이라 lint 는 Ubuntu 컨테이너에서 먼저 돌린다.
  # 버전은 .mise.toml 과 맞춘다.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: SwiftFormat
        # Linux static 빌드가 파일이 많을 때 세그폴트(exit 139)로 죽는다. --verbose 로 돌리면 재현되지 않는다.
        run: docker run --rm -v "$PWD:/work" -w /work ghcr.io/nicklockwood/swiftformat:0.63.0 --lint --verbose .
      - name: SwiftLint
        # 이미지가 swiftlint 를 실행하므로 인자로 swiftlint 를 다시 넘기면 경로로 읽힌다. 실행 파일을 명시한다.
        run: docker run --rm -v "$PWD:/work" -w /work --entrypoint swiftlint ghcr.io/realm/swiftlint:0.65.1 lint --strict --quiet

  test:
    needs: lint
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: Build & Test
        run: make test
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: TestResults
          path: build/TestResults.xcresult
          retention-days: 7
