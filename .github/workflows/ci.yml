name: CI

on:
  pull_request:
    paths-ignore: ["**.md", "docs/**", ".claude/**"]
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", ".claude/**"]
  # PR 없이 브랜치에서 CI 를 돌릴 때: gh workflow run CI --ref <브랜치>
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 비공개 레포의 macOS 러너는 분당 10배 과금이라 lint 는 Ubuntu 컨테이너에서 먼저 돌린다.
  # 버전은 .mise.toml 과 맞춘다.
  # 위반은 GitHub Actions 어노테이션으로 출력해 PR 의 Files changed 에서 해당 줄에 표시한다.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # 테스트 미수행 코멘트
    steps:
      - uses: actions/checkout@v7
      - name: SwiftFormat
        # Linux static 빌드가 파일이 많을 때 세그폴트(exit 139)로 죽는다. --verbose 로 돌리면 재현되지 않는다.
        # 어노테이션 경로가 컨테이너 절대 경로(/work/…)로 나오므로 레포 상대 경로로 바꾸고, 위반은 error 로 올린다.
        # 어노테이션이 stdout·stderr 양쪽에 같은 내용으로 나오므로 합친 뒤 어노테이션 줄만 중복을 지운다.
        shell: bash # pipefail 로 swiftformat 의 종료 코드를 유지한다
        run: |
          docker run --rm -v "$PWD:/work" -w /work ghcr.io/nicklockwood/swiftformat:0.63.0 \
            --lint --verbose --reporter github-actions-log . 2>&1 \
            | sed -u 's|^::warning file=/work/|::error file=|' \
            | awk '!/^::/ || !seen[$0]++ { print; fflush() }'
      - name: SwiftLint
        # SwiftFormat 이 실패해도 SwiftLint 위반을 함께 보고한다.
        if: ${{ !cancelled() }}
        # 이미지가 swiftlint 를 실행하므로 인자로 swiftlint 를 다시 넘기면 경로로 읽힌다. 실행 파일을 명시한다.
        run: |
          docker run --rm -v "$PWD:/work" -w /work --entrypoint swiftlint ghcr.io/realm/swiftlint:0.65.1 \
            lint --strict --quiet --reporter github-actions-logging
      # lint 가 실패하면 test 잡이 돌지 않으므로, 이전 push 의 테스트 결과 코멘트를 "미수행"으로 바꾼다.
      - name: 테스트 미수행 PR 코멘트
        if: ${{ failure() && github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: test-results
          message: |
            ### ⏭️ 테스트 미수행
            lint 가 실패해 테스트를 돌리지 않았습니다. [실행 로그](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})에서 lint 오류를 확인하세요.

  test:
    needs: lint
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: Build & Test
        run: make test
      # 테스트 성공·실패와 관계없이 결과를 요약해 PR 코멘트 하나를 push 마다 갱신한다.
      # lint 가 실패한 push 는 lint 잡이 같은 코멘트를 "테스트 미수행"으로 바꾼다.
      - name: 테스트 결과 요약
        if: ${{ !cancelled() }}
        run: |
          mkdir -p build
          .github/scripts/test-summary.sh build/TestResults.xcresult > build/test-summary.md
          cat build/test-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: 테스트 결과 PR 코멘트
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: test-results
          path: build/test-summary.md
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: TestResults
          path: build/TestResults.xcresult
          retention-days: 7
