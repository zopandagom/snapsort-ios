name: CI

on:
  pull_request:
    paths-ignore: ["**.md", "docs/**", ".claude/**"]
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", ".claude/**"]
  # PR 없이 브랜치에서 CI 를 돌릴 때: gh workflow run CI --ref <브랜치>
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 비공개 레포의 macOS 러너는 분당 10배 과금이라 lint 는 Ubuntu 컨테이너에서 먼저 돌린다.
  # 버전은 .mise.toml 과 맞춘다.
  # SwiftLint 결과는 PR 에서 Danger(Dangerfile)가 위반 줄에 코멘트로 단다.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Danger 가 base 와의 diff 를 계산한다
      - name: SwiftFormat
        # Linux static 빌드가 파일이 많을 때 세그폴트(exit 139)로 죽는다. --verbose 로 돌리면 재현되지 않는다.
        run: docker run --rm -v "$PWD:/work" -w /work ghcr.io/nicklockwood/swiftformat:0.63.0 --lint --verbose .
      - name: SwiftLint
        # 위반이 있으면 0 이 아닌 코드로 끝나므로 판정은 아래 단계에 맡긴다.
        # 설정 오류로 JSON 이 비면 Dangerfile·jq 가 실패시킨다.
        # 이미지가 swiftlint 를 실행하므로 인자로 swiftlint 를 다시 넘기면 경로로 읽힌다. 실행 파일을 명시한다.
        run: |
          mkdir -p build
          docker run --rm -v "$PWD:/work" -w /work --entrypoint swiftlint ghcr.io/realm/swiftlint:0.65.1 \
            lint --strict --quiet --reporter json > build/swiftlint.json || true
      # Dependabot PR 은 GITHUB_TOKEN 이 읽기 전용이라 코멘트를 달 수 없으므로 main push 와 같이 jq 로 판정한다.
      - uses: ruby/setup-ruby@v1
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Danger
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        run: bundle exec danger --fail-on-errors=true
        env:
          DANGER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: SwiftLint 결과 확인 (Danger 를 쓰지 않을 때)
        if: github.event_name == 'push' || github.actor == 'dependabot[bot]'
        run: |
          jq -e 'length == 0' build/swiftlint.json > /dev/null || {
            jq -r '.[] | "\(.file):\(.line): \(.rule_id) \(.reason)"' build/swiftlint.json
            exit 1
          }
      # lint 가 실패하면 test 잡이 돌지 않으므로, 이전 push 의 테스트 결과 코멘트를 "미수행"으로 바꾼다.
      - name: 테스트 미수행 PR 코멘트
        if: ${{ failure() && github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: test-results
          message: |
            ### ⏭️ 테스트 미수행
            lint 가 실패해 테스트를 돌리지 않았습니다. [실행 로그](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})에서 lint 오류를 확인하세요.

  test:
    needs: lint
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: Build & Test
        run: make test
      # 테스트 성공·실패와 관계없이 결과를 요약해 PR 코멘트 하나를 push 마다 갱신한다.
      # lint 가 실패한 push 는 lint 잡이 같은 코멘트를 "테스트 미수행"으로 바꾼다.
      - name: 테스트 결과 요약
        if: ${{ !cancelled() }}
        run: |
          mkdir -p build
          .github/scripts/test-summary.sh build/TestResults.xcresult > build/test-summary.md
          cat build/test-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: 테스트 결과 PR 코멘트
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: test-results
          path: build/test-summary.md
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: TestResults
          path: build/TestResults.xcresult
          retention-days: 7
