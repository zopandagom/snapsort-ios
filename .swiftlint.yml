# included 를 두지 않고 레포 전체를 검사한다 (생성물만 제외).
excluded:
  - "**/Derived"
  - build
  - .build

# SwiftFormat 과 겹치거나 충돌하는 규칙은 끈다 (포맷은 SwiftFormat 이 담당)
disabled_rules:
  - trailing_comma
  - opening_brace
  - todo

opt_in_rules:
  - contains_over_first_not_nil
  - empty_count
  - empty_string
  - explicit_init
  - first_where
  - flatmap_over_map_reduce
  - last_where
  - private_swiftui_state
  - sorted_first_last
  - toggle_bool
  - unowned_variable_capture
  - weak_delegate

line_length:
  warning: 120
  ignores_comments: true
  ignores_urls: true

identifier_name:
  excluded: [id, x, y]

# ── 아키텍처 규칙 (docs/ARCHITECTURE.md) ─────────────────────────────
custom_rules:
  impl_import_only_in_assembly:
    name: "Impl 은 조립 지점(App·Extension)에서만 import"
    # 조립 지점은 App 과 Extension(위젯)이라 둘은 검사하지 않는다.
    # Impl 이 다른 Client 를 조합해도 그 Interface 만 쓰도록 Impl 폴더도 검사한다 (정적 프레임워크라 의존성에 없어도 import 가 컴파일될 수 있다).
    included: "Projects/(Features|Clients/[^/]+/(Interface|Impl|Testing))/"
    regex: "^\\s*(@\\w+(\\([^)]*\\))?\\s+)*((public|package|internal|fileprivate|private)\\s+)?import\\s+((typealias|struct|class|enum|protocol|let|var|func)\\s+)?\\w+Impl(\\.\\w+)*\\s*(//[^\\n]*|/\\*[^\\n]*)?$"
    message: "Client Impl 은 조립 지점(App·Extension)에서만 import 합니다. Feature 와 다른 Client Impl 은 Interface 에 의존하세요."
    severity: error

  testing_import_not_in_production:
    name: "Testing 모듈은 테스트/Example 에서만"
    included: "Projects/(App/Sources|Extensions/[^/]+/Sources|Features/[^/]+/Sources|Clients/[^/]+/(Interface|Impl))/"
    regex: "^\\s*(@\\w+(\\([^)]*\\))?\\s+)*((public|package|internal|fileprivate|private)\\s+)?import\\s+((typealias|struct|class|enum|protocol|let|var|func)\\s+)?\\w+Testing(\\.\\w+)*\\s*(//[^\\n]*|/\\*[^\\n]*)?$"
    message: "Fake 가 든 Testing 모듈은 Tests 와 Example 타깃에서만 import 합니다."
    severity: error

  system_framework_only_in_impl:
    name: "Apple 데이터 프레임워크는 Client Impl 에서만"
    included: "Projects/(App|Extensions|Features|Shared|Clients/[^/]+/(Interface|Testing))/"
    regex: "^\\s*(@\\w+(\\([^)]*\\))?\\s+)*((public|package|internal|fileprivate|private)\\s+)?import\\s+((typealias|struct|class|enum|protocol|let|var|func)\\s+)?(Photos|PhotosUI|Vision|FoundationModels|SwiftData|StoreKit|UserNotifications|BackgroundTasks)(\\.\\w+)*\\s*(//[^\\n]*|/\\*[^\\n]*)?$"
    message: "사진·OCR·AI·저장소·결제·알림·BG 작업 프레임워크는 Client Impl 안에서만 사용합니다. Interface 나 Core 에 값 타입을 정의하세요."
    severity: error

  widget_center_only_in_impl:
    name: "WidgetCenter 는 Client Impl 에서만"
    # 위젯 Feature 는 WidgetKit 을 import 해야 하므로(TimelineProvider) import 가 아니라 이름을 막는다.
    included: "Projects/(App|Extensions|Features|Shared|Clients/[^/]+/(Interface|Testing))/"
    regex: "\\bWidgetCenter\\b"
    excluded_match_kinds: [comment, doccomment]
    message: "위젯 갱신 요청은 WidgetTimelineClient 로 합니다. View·Feature 가 WidgetCenter 를 직접 부르면 보관함의 값이 바뀔 때만 요청하는 중복 제거와 테스트를 거치지 않습니다(App init 의 1회 요청도 Client 로 합니다) (docs/ARCHITECTURE.md §4 만료 임박 위젯)."
    severity: error

  background_task_only_in_impl:
    name: "앱 실행 시간 빌리기는 Client Impl 에서만"
    # UIKit·Foundation 은 여러 레이어가 import 하므로 import 가 아니라 이름을 막는다(widget_center_only_in_impl 과 같은 방식).
    included: "Projects/(App|Extensions|Features|Shared|Clients/[^/]+/(Interface|Testing))/"
    regex: "\\b(beginBackgroundTask|performExpiringActivity)\\b"
    excluded_match_kinds: [comment, doccomment]
    message: "앱 실행 시간 빌리기는 BackgroundIndexing Client Impl 에서만 합니다. 앱이 뒤로 갈 때 진행 중 저장이 끝날 때까지 빌리고 돌려주는 순서를 한곳에서 맞추고 테스트합니다 (docs/ARCHITECTURE.md §4 인덱싱)."
    severity: error

  shared_independent_of_clients:
    name: "Shared 는 Client 에 의존하지 않음"
    included: "Projects/Shared/[^/]+/Sources/"
    regex: "^\\s*(@\\w+(\\([^)]*\\))?\\s+)*((public|package|internal|fileprivate|private)\\s+)?import\\s+((typealias|struct|class|enum|protocol|let|var|func)\\s+)?\\w+(Interface|Impl|Testing)(\\.\\w+)*\\s*(//[^\\n]*|/\\*[^\\n]*)?$"
    message: "Shared 모듈은 여러 모듈이 함께 쓰는 순수 코드입니다. Client 가 Shared 에 의존하고, 그 반대는 하지 않습니다."
    severity: error

  location_map_only_outside_shared_interface:
    name: "CoreLocation·MapKit 은 Shared·Interface·Testing 밖에서"
    included: "Projects/(Shared/[^/]+/Sources|Clients/[^/]+/(Interface|Testing))/"
    regex: "^\\s*(@\\w+(\\([^)]*\\))?\\s+)*((public|package|internal|fileprivate|private)\\s+)?import\\s+((typealias|struct|class|enum|protocol|let|var|func)\\s+)?(CoreLocation|MapKit)(\\.\\w+)*\\s*(//[^\\n]*|/\\*[^\\n]*)?$"
    message: "좌표는 Core 의 Coordinate 로 넘깁니다. 지오코딩·지도 앱 열기는 Client Impl, Map 렌더링은 Feature View 에서 합니다 (docs/ARCHITECTURE.md §4)."
    severity: error

  core_no_ui_framework:
    name: "Core 는 UI 프레임워크를 쓰지 않음"
    included: "Projects/Shared/Core/Sources/"
    regex: "^\\s*(@\\w+(\\([^)]*\\))?\\s+)*((public|package|internal|fileprivate|private)\\s+)?import\\s+((typealias|struct|class|enum|protocol|let|var|func)\\s+)?(SwiftUI|UIKit)(\\.\\w+)*\\s*(//[^\\n]*|/\\*[^\\n]*)?$"
    message: "Core 는 부수효과 없는 도메인 값 타입·규칙입니다. 화면 코드는 Feature 나 DesignSystem 에, 앱 열기 같은 부수효과는 Client Impl 에 둡니다."
    severity: error

  no_two_way_model_binding:
    name: "Model 양방향 바인딩 금지"
    included: "Projects/Features/"
    regex: "\\$(self\\.)?\\w*[mM]odel\\."
    message: "Model 상태는 private(set) 입니다. Binding(get:set:) 으로 이벤트 메서드를 호출하세요."
    severity: error

  no_network:
    name: "네트워크 호출 금지"
    included: "Projects/"
    regex: "\\b(URLSession|URLRequest|NWConnection)\\b"
    message: "'사진이 기기 밖으로 나가지 않는다'가 제품의 핵심 약속입니다. 네트워크 코드는 사전 합의 후 별도 모듈로 추가합니다."
    severity: error

  no_private_cloud_compute:
    name: "온디바이스 언어 모델만"
    included: "Projects/"
    regex: "\\bPrivateCloudCompute\\w*"
    # 이 규칙을 설명하는 문서 주석은 막지 않는다. 문자열 속 이름은 막는다(동적으로 찾는 우회).
    excluded_match_kinds: [comment, doccomment]
    message: "'사진과 읽은 텍스트는 기기 밖으로 나가지 않는다'가 제품의 핵심 약속입니다. Foundation Models 는 온디바이스 SystemLanguageModel 만 씁니다 (Private Cloud Compute 는 텍스트를 Apple 서버로 보냅니다)."
    severity: error
